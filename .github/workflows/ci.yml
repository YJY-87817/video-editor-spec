name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 專案只支援 Windows（WPF），整合測試也需要 ffmpeg.exe / ffprobe.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install FFmpeg
        shell: pwsh
        run: |
          # 固定版本：FFmpeg 改版可能改變輸出或預設值，讓測試在程式碼沒變時失敗。升級時改這裡並確認 CI 通過。
          choco install ffmpeg --version 9.0.2 --no-progress -y
          # 測試需要 libx264 與 libx265
          $encoders = ffmpeg -hide_banner -encoders 2>&1 | Out-String
          foreach ($name in 'libx264', 'libx265') {
            if ($encoders -notmatch $name) { throw "FFmpeg 缺少 $name" }
          }
          ffmpeg -version | Select-Object -First 1

      - name: Build
        run: dotnet build VideoEditor.slnx --configuration Release

      - name: Test
        run: dotnet test VideoEditor.slnx --configuration Release --no-build --verbosity normal

      - name: Publish (驗證 README 的發佈指令)
        shell: pwsh
        run: |
          dotnet publish src/VideoEditor.App -c Release -r win-x64 --self-contained true -o publish
          if (-not (Test-Path publish/VideoEditor.App.exe)) { throw '找不到 publish/VideoEditor.App.exe' }
          if (-not (Test-Path publish/libvlc/win-x64/libvlc.dll)) { throw '找不到 publish/libvlc/win-x64/libvlc.dll' }
          foreach ($f in 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'licenses/LGPL-2.1.txt') {
            if (-not (Test-Path "publish/$f")) { throw "發佈資料夾缺少授權檔 $f" }
          }
          # libvlc plugins 不得含 GPL 模組（授權字串內嵌在每個 plugin DLL）
          $gpl = Get-ChildItem publish/libvlc -Recurse -Filter *.dll | Where-Object {
            $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($_.FullName))
            $text -match 'Licensed under the terms of the GNU General Public License'
          }
          if ($gpl) { throw "發現 GPL 授權的 libvlc 模組：$($gpl.Name -join ', ')" }
          $others = Get-ChildItem publish/libvlc -Directory | Where-Object { $_.Name -ne 'win-x64' }
          if ($others) { throw "libvlc 只應有 win-x64，發現：$($others.Name -join ', ')" }
          $plugins = (Get-ChildItem publish/libvlc/win-x64/plugins -Recurse -Filter *.dll).Count
          "libvlc plugins：$plugins 個，皆非 GPL"
          Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "發佈資料夾：$($_.Count) 個檔案，$([math]::Round($_.Sum / 1MB)) MB" }
