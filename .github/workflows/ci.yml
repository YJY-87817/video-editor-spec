name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 專案只支援 Windows（WPF），整合測試也需要 ffmpeg.exe / ffprobe.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 動作固定到 commit SHA（標籤可以被移動）；註解是對應的版本。Dependabot 會連同註解一起更新。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install FFmpeg
        shell: pwsh
        run: |
          # 固定版本：FFmpeg 改版可能改變輸出或預設值，讓測試在程式碼沒變時失敗。升級時改這裡並確認 CI 通過。
          choco install ffmpeg --version 9.0.2 --no-progress -y
          # 測試需要 libx264 與 libx265
          $encoders = ffmpeg -hide_banner -encoders 2>&1 | Out-String
          foreach ($name in 'libx264', 'libx265') {
            if ($encoders -notmatch $name) { throw "FFmpeg 缺少 $name" }
          }
          ffmpeg -version | Select-Object -First 1

      - name: Restore (鎖定模式)
        # packages.lock.json 與專案檔對不上、或套件雜湊不符時會失敗。更新套件後要在本機重新產生鎖定檔。
        run: dotnet restore VideoEditor.slnx -p:RestoreLockedMode=true

      - name: Build
        run: dotnet build VideoEditor.slnx --configuration Release --no-restore

      - name: Test
        # 順便收集覆蓋率（只是報告，不設門檻）
        run: dotnet test VideoEditor.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage summary
        if: success() || failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $file = Get-ChildItem coverage -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) { 'No coverage report found'; return }
          $xml = [xml](Get-Content $file.FullName -Raw)
          $root = $xml.coverage
          $overall = [math]::Round([double]::Parse($root.'line-rate', [cultureinfo]::InvariantCulture) * 100, 1)
          $rows = foreach ($group in ($xml.SelectNodes('//class') | Group-Object { $_.GetAttribute('filename') })) {
            $classLines = foreach ($class in $group.Group) { $class.SelectNodes('lines/line') }
            $total = @($classLines).Count
            if ($total -lt 20) { continue }
            $covered = @($classLines | Where-Object { [int]$_.GetAttribute('hits') -gt 0 }).Count
            [pscustomobject]@{ File = ($group.Name -replace [regex]::Escape($PWD.Path + '\'), ''); Rate = $covered / $total; Lines = $total }
          }
          $out = @("## 測試覆蓋率（行）", "", "整體：$overall%（$($root.'lines-covered') / $($root.'lines-valid') 行）", "", "覆蓋率最低的檔案（20 行以上）：", "", "| 檔案 | 覆蓋率 | 行數 |", "|---|---|---|")
          $out += $rows | Sort-Object Rate | Select-Object -First 25 | ForEach-Object { '| {0} | {1:P0} | {2} |' -f $_.File, $_.Rate, $_.Lines }
          $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish (驗證 README 的發佈指令)
        shell: pwsh
        run: |
          dotnet publish src/VideoEditor.App -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o publish
          if (-not (Test-Path publish/VideoEditor.App.exe)) { throw '找不到 publish/VideoEditor.App.exe' }
          if (-not (Test-Path publish/libvlc/win-x64/libvlc.dll)) { throw '找不到 publish/libvlc/win-x64/libvlc.dll' }
          foreach ($f in 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'licenses/LGPL-2.1.txt') {
            if (-not (Test-Path "publish/$f")) { throw "發佈資料夾缺少授權檔 $f" }
          }
          # libvlc plugins 不得含 GPL 模組（授權字串內嵌在每個 plugin DLL）
          $gpl = Get-ChildItem publish/libvlc -Recurse -Filter *.dll | Where-Object {
            $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($_.FullName))
            $text -match 'Licensed under the terms of the GNU General Public License'
          }
          if ($gpl) { throw "發現 GPL 授權的 libvlc 模組：$($gpl.Name -join ', ')" }
          $others = Get-ChildItem publish/libvlc -Directory | Where-Object { $_.Name -ne 'win-x64' }
          if ($others) { throw "libvlc 只應有 win-x64，發現：$($others.Name -join ', ')" }
          $plugins = (Get-ChildItem publish/libvlc/win-x64/plugins -Recurse -Filter *.dll).Count
          "libvlc plugins：$plugins 個，皆非 GPL"
          Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "發佈資料夾：$($_.Count) 個檔案，$([math]::Round($_.Sum / 1MB)) MB" }
